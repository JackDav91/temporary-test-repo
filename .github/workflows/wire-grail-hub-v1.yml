name: Wire Grail Hub v1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wire-grail-hub-v1.yml'
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Wire Grail Hub loaders and cache
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css='<link href="grail-hub.css?v=1.0.0" rel="stylesheet" data-gengrail-grail-hub-css="1"/>'
          js='<script src="grail-hub.js?v=1.0.0" data-gengrail-grail-hub="1"></script>'
          if 'data-gengrail-grail-hub-css' not in s:
              s=s.replace('</head>',css+'\n</head>',1)
          if 'data-gengrail-grail-hub="1"' not in s:
              s=s.replace('</body>',js+'\n</body>',1)
          p.write_text(s)

          p=Path('sw.js')
          s=p.read_text()
          s=s.replace("gengrail-log-v22.0.5-home-compact","gengrail-log-v22.1.0-grail-hub-v1")
          if "'./grail-hub.css'" not in s:
              s=s.replace("'./home-compact.css'","'./home-compact.css','./grail-hub.css','./grail-hub.js'")
          p.write_text(s)
          PY
      - name: Safety gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -o 'data-gengrail-grail-hub-css="1"' index.html | wc -l)" -eq 1
          test "$(grep -o 'data-gengrail-grail-hub="1"' index.html | wc -l)" -eq 1
          grep -q "grail-hub.css" sw.js
          grep -q "grail-hub.js" sw.js
          grep -q "getGrailPlanState" grail-hub.js
          grep -q "GengrailGrailHub" grail-hub.js
          grep -q "recognise-card" index.html
          grep -q "graded-integration.js" index.html
          grep -q "gengrail-ebay.js" index.html
      - name: Commit wired Grail Hub
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Launch Grail Hub v1 buying shell'
          git push origin HEAD:main
