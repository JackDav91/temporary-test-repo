name: Harden Grail Hub identity v1.7
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-fix-grail-preferred-rank-v3.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 10
      - name: Apply identity hardening
        run: python3 .github/scripts/harden_grail_identity_v17.py
      - name: Commit app files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add grail-hub.js sw.js
          git commit -m 'Harden Grail Hub card identity accuracy'
          git push origin HEAD:main
