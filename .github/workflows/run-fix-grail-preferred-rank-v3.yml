name: Fix Grail preferred discovery ranking v3
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-fix-grail-preferred-rank-v3.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 10
      - name: Apply preferred ranking fix
        run: python3 .github/scripts/fix_grail_preferred_rank_v3.py
      - name: Commit app files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add grail-hub.js index.html sw.js
          git commit -m 'Fix preferred Grail discovery ranking boost'
          git push origin HEAD:main
