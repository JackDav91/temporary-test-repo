name: Fix graded bridge loader placement on temp main

on:
  push:
    branches:
      - agent/slab-recognition-v1
    paths:
      - .github/workflows/fix-graded-main-loader.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout slab branch
        uses: actions/checkout@v4
        with:
          ref: agent/slab-recognition-v1
          fetch-depth: 0

      - name: Preserve graded bridge
        run: cp graded-integration.js /tmp/graded-integration.js

      - name: Switch to temp main
        run: git checkout main

      - name: Rebuild index from locked golden raw commit and append bridge at final body close
        run: |
          git show 25df810110e8800691765c95d4e30bf0f0c1e06a:index.html > /tmp/golden-index.html
          cp /tmp/golden-index.html index.html
          cp /tmp/graded-integration.js graded-integration.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='<script src="graded-integration.js?v=21.5.1" data-gengrail-graded-main="1"></script>\n'
          i=s.rfind('</body>')
          if i < 0:
              raise SystemExit('Safety stop: final </body> not found')
          s=s[:i]+marker+s[i:]
          p.write_text(s)
          PY

      - name: Verify golden raw content is byte-identical apart from final script include
        run: |
          python3 - <<'PY'
          from pathlib import Path
          golden=Path('/tmp/golden-index.html').read_text()
          after=Path('index.html').read_text()
          marker='<script src="graded-integration.js?v=21.5.1" data-gengrail-graded-main="1"></script>\n'
          if after.count(marker) != 1:
              raise SystemExit('Safety stop: expected exactly one graded loader')
          if after.replace(marker,'') != golden:
              raise SystemExit('Safety stop: raw index differs from golden baseline')
          final_body=after.rfind('</body>')
          marker_at=after.find(marker)
          if not (0 <= marker_at < final_body and after[marker_at+len(marker):].startswith('</body>')):
              raise SystemExit('Safety stop: graded loader is not immediately before final page </body>')
          for token in ['async function pricingRecogniseFile(file)','async function recogniseCardFile(file)','function priceCalc()']:
              if token not in after:
                  raise SystemExit('Safety stop: missing locked raw function '+token)
          PY

      - name: Commit corrected safe integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html graded-integration.js
          git commit -m 'Fix graded bridge loader while preserving golden raw app byte-for-byte'
          git push origin main
