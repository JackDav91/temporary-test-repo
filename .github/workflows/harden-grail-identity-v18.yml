name: Harden Grail Hub identity v1.8

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/harden-grail-identity-v18.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 5
      - name: Apply identity hardening
        run: python .github/scripts/grail_identity_v18.py
      - name: Commit identity v1.8
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add grail-hub.js sw.js
          git commit -m 'Finalise Grail Hub language and era identity guards'
          git push origin HEAD:main
# rerun: idempotent cleanup
