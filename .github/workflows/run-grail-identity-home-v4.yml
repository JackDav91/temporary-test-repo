name: Run Grail identity and Home viewport v4
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-grail-identity-home-v4.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 10
      - name: Apply guarded identity and viewport patch
        run: python3 .github/scripts/apply_grail_identity_home_v4.py
      - name: Commit app files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add grail-hub.js home-compact.css index.html sw.js
          git commit -m 'Harden Grail card identity and fill Home viewport'
          git push origin HEAD:main
