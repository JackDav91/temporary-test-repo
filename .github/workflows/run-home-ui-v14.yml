name: Run Home UI viewport patch v1.4
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-home-ui-v14.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 10
      - name: Apply guarded Home UI patch
        run: python3 .github/scripts/apply_home_ui_v14.py
      - name: Commit Home UI files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add home-compact.css index.html sw.js
          git commit -m 'Fix Home viewport sizing without changing app logic'
          git push origin HEAD:main
