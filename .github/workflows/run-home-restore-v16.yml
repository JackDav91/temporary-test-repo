name: Run restored Home composition v1.6
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-home-restore-v16.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply guarded Home v1.6 patch
        run: python .github/scripts/apply_home_restore_v16.py
      - name: Commit Home v1.6 files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add home-compact.css index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m 'Restore larger scrolling Home composition'
          git push origin HEAD:main
