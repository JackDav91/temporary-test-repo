name: Emergency revert broken Pricing v2.2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emergency-revert-pricing-v22.yml'
permissions:
  contents: write
jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 20
      - name: Revert broken Pricing scan patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git revert --no-edit ce5fd9ed5fd6bb77c9c48f2924ea1e677e7a35ce
          git push origin HEAD:main
