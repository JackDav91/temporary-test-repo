name: Run Buying UI cleanup v1.7
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-buying-ui-v17.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply guarded Buying UI v1.7 patch
        run: python .github/scripts/apply_buying_ui_v17.py
      - name: Commit Buying UI files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add grail-hub.js grail-hub.css index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m 'Clean up Buying and Opportunity Stream UI'
          git push origin HEAD:main
