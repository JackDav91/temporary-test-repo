name: Run Stock single-candidate v2.0
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-stock-single-candidate-v20.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 10
      - name: Apply Stock single-candidate patch
        run: python .github/scripts/apply_stock_single_candidate_v20.py
      - name: Commit Stock recognition files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add graded-integration.js index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m 'Enforce one active Stock recognition candidate'
          git push origin HEAD:main
# retry 2 after matcher hardening
