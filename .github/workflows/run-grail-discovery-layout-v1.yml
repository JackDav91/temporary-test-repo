name: Run Grail discovery layout v1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-grail-discovery-layout-v1.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 10
      - name: Apply guarded patch
        run: python3 .github/scripts/apply_grail_discovery_layout_v1.py
      - name: Commit app files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add grail-hub.js grail-hub.css home-compact.css index.html
          git commit -m 'Add daily Grail discovery foundation and fix layout drift'
          git push origin HEAD:main
