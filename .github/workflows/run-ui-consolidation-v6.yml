name: Run full UI consolidation v6
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-ui-consolidation-v6.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 10
      - name: Correct non-functional safety assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/apply_ui_consolidation_v6.py')
          s=p.read_text()
          s=s.replace("'ui-consolidation.js':['visualViewport','PHOTO LIBRARY','ui-settings-clean','REVIEW'],","'ui-consolidation.js':['visualViewport','PHOTO LIBRARY','ui-settings-clean'],")
          p.write_text(s)
          PY
      - name: Apply guarded UI consolidation patch
        run: python3 .github/scripts/apply_ui_consolidation_v6.py
      - name: Commit app files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui-consolidation.css ui-consolidation.js grail-hub.js graded-integration.js index.html sw.js
          git commit -m 'Consolidate Gengrail UI across core screens'
          git push origin HEAD:main
