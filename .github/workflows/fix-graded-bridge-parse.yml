name: Fix graded bridge parse regression

on:
  push:
    branches:
      - agent/slab-recognition-v1
    paths:
      - .github/workflows/fix-graded-bridge-parse.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Fix malformed graded function separators only
        run: |
          cp graded-integration.js /tmp/graded-before.js
          cp index.html /tmp/index-before.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('graded-integration.js')
          s=p.read_text()
          fixes=0
          for bad,good in [
              ('}\\nfunction ','}\nfunction '),
              ('}\\nasync function ','}\nasync function ')
          ]:
              c=s.count(bad)
              fixes+=c
              s=s.replace(bad,good)
          if fixes < 1:
              raise SystemExit('Safety stop: expected malformed literal separator not found')
          p.write_text(s)
          print('Fixed literal separators:',fixes)

          p=Path('index.html')
          s=p.read_text()
          old='<script src="graded-integration.js?v=21.7.0" data-gengrail-graded-main="1"></script>'
          new='<script src="graded-integration.js?v=21.7.1" data-gengrail-graded-main="1"></script>'
          if s.count(old)!=1:
              raise SystemExit('Safety stop: graded loader marker missing/non-unique')
          p.write_text(s.replace(old,new,1))
          PY

      - name: JavaScript syntax gate
        run: node --check graded-integration.js

      - name: Verify raw safety boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          before=Path('/tmp/index-before.html').read_text()
          after=Path('index.html').read_text()
          old='<script src="graded-integration.js?v=21.7.0" data-gengrail-graded-main="1"></script>'
          new='<script src="graded-integration.js?v=21.7.1" data-gengrail-graded-main="1"></script>'
          if after != before.replace(old,new,1):
              raise SystemExit('index changed beyond graded cache bust')
          g=Path('graded-integration.js').read_text()
          for x in [
            "const ENDPOINT='https://gengrail-card-ai.gengrailtcg.workers.dev'",
            'function stockHtml(r)',
            'function stockUI(r)',
            "marketGrader=unresolved?'ACE':r.grader",
            'PROVISIONAL_ACE_MARKET',
            'async function syncPricing(r)',
            'recogniseSlabAttempt'
          ]:
              if x not in g: raise SystemExit('Required graded boundary marker missing: '+x)
          if '}\\nfunction ' in g or '}\\nasync function ' in g:
              raise SystemExit('Malformed literal function separator remains')
          PY

      - name: Commit to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add graded-integration.js index.html
          git commit -m 'Fix graded bridge parse regression and restore controls'
          git push origin main
