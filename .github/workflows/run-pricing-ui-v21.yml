name: Run Pricing UI v2.2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-pricing-ui-v21.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 10
      - name: Apply Pricing Calculator final UI patch
        run: python .github/scripts/apply_pricing_ui_v21.py
      - name: Commit Pricing Calculator final UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m 'Restore Pricing scan card and finish UI cleanup'
          git push origin HEAD:main
