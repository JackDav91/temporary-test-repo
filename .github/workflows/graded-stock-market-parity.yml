name: Graded Stock market parity

on:
  push:
    branches:
      - agent/slab-recognition-v1
    paths:
      - .github/workflows/graded-stock-market-parity.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch graded Stock market flow only
        run: |
          cp graded-integration.js /tmp/graded-before.js
          cp index.html /tmp/index-before.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('graded-integration.js')
          s=p.read_text()
          old_stockui="function stockUI(r){style();let h=$('gradedStockBridge');if(!h){h=document.createElement('div');h.id='gradedStockBridge';h.className='graded-bridge';const p=$('stockEntryPanel');p?.parentNode?.insertBefore(h,p)}h.hidden=false;h.innerHTML=html(r);const b=h.querySelector('[data-gconfirm]');if(b)b.onclick=()=>{const v=h.querySelector('[data-ggrader]')?.value;if(!v)return;userConfirm(r,v);syncStock(r)}}"
          new_stockui="function stockUI(r){style();let h=$('gradedStockBridge');if(!h){h=document.createElement('div');h.id='gradedStockBridge';h.className='graded-bridge';const p=$('stockEntryPanel');p?.parentNode?.insertBefore(h,p)}h.hidden=false;h.innerHTML=html(r)+(r?.marketPricing?.available?`<div class=\"actions graded-stock-market-actions\"><button class=\"btn graded-use-price\" data-guseprice type=\"button\">USE SUGGESTED PRICE</button></div>`:'');const b=h.querySelector('[data-gconfirm]');if(b)b.onclick=async()=>{const v=h.querySelector('[data-ggrader]')?.value;if(!v)return;userConfirm(r,v);await syncStock(r)};const use=h.querySelector('[data-guseprice]');if(use)use.onclick=()=>{const v=Number(r?.marketPricing?.suggestedGbp||0);if(!(v>0))return;const t=$('plist');if(t){t.value=v.toFixed(2);t.dispatchEvent(new Event('input',{bubbles:true}));t.dispatchEvent(new Event('change',{bubbles:true}));t.scrollIntoView({behavior:'smooth',block:'center'})}}}"
          if s.count(old_stockui)!=1: raise SystemExit('Safety stop: stockUI marker missing/non-unique')
          s=s.replace(old_stockui,new_stockui,1)

          old_sync="function syncStock(r){stockResult=r;if($('pn'))$('pn').value=title(r);if($('pc')&&[...$('pc').options].some(o=>o.value==='Graded'))$('pc').value='Graded';if($('pcondition')&&[...$('pcondition').options].some(o=>o.value==='Graded'))$('pcondition').value='Graded';syncNotes(r);stockUI(r);if($('aiIntakeWorkspace'))$('aiIntakeWorkspace').hidden=false;if($('stockEntryPanel'))$('stockEntryPanel').hidden=false}"
          new_sync="async function syncStock(r){stockResult=r;if($('pn'))$('pn').value=title(r);if($('pc')&&[...$('pc').options].some(o=>o.value==='Graded'))$('pc').value='Graded';if($('pcondition')&&[...$('pcondition').options].some(o=>o.value==='Graded'))$('pcondition').value='Graded';syncNotes(r);r.gradedMarketStatus='CHECKING_EXACT_MARKET';r.marketPricing={available:false,note:'Checking exact card + grader + grade market evidence…'};stockUI(r);if($('aiIntakeWorkspace'))$('aiIntakeWorkspace').hidden=false;if($('stockEntryPanel'))$('stockEntryPanel').hidden=false;const market=await lookupMarket(r);r.marketPricing=market;r.gradedMarketStatus=market.status;stockUI(r);syncNotes(r)}"
          if s.count(old_sync)!=1: raise SystemExit('Safety stop: syncStock marker missing/non-unique')
          s=s.replace(old_sync,new_sync,1)

          style_marker='.graded-import-status{margin:8px 0 2px;color:#aaa;font-size:12px;line-height:1.4}.graded-import-status:empty{display:none}'
          style_add=style_marker+'\n.graded-stock-market-actions{margin-top:14px}.graded-stock-market-actions .graded-use-price{width:100%;background:#e0ad16!important;color:#080808!important;border:1px solid #f2c84b!important;border-radius:10px!important;padding:14px!important;font-weight:950!important}'
          if s.count(style_marker)!=1: raise SystemExit('Safety stop: style marker missing/non-unique')
          s=s.replace(style_marker,style_add,1)
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text()
          old='<script src="graded-integration.js?v=21.6.0" data-gengrail-graded-main="1"></script>'
          new='<script src="graded-integration.js?v=21.6.1" data-gengrail-graded-main="1"></script>'
          if s.count(old)!=1: raise SystemExit('Safety stop: loader marker missing/non-unique')
          p.write_text(s.replace(old,new,1))
          PY

      - name: Verify raw safety boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          before=Path('/tmp/index-before.html').read_text()
          after=Path('index.html').read_text()
          old='<script src="graded-integration.js?v=21.6.0" data-gengrail-graded-main="1"></script>'
          new='<script src="graded-integration.js?v=21.6.1" data-gengrail-graded-main="1"></script>'
          if after != before.replace(old,new,1): raise SystemExit('index changed beyond graded loader cache-bust')
          g=Path('graded-integration.js').read_text()
          for x in ["const ENDPOINT='https://gengrail-card-ai.gengrailtcg.workers.dev'","async function lookupMarket(r)","async function syncPricing(r)","recogniseSlabAttempt"]:
            if x not in g: raise SystemExit('Required graded/raw boundary marker missing: '+x)
          if "const t=$('plist')" not in g or 'USE SUGGESTED PRICE' not in g: raise SystemExit('Stock market parity patch missing')
          PY

      - name: Commit to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add graded-integration.js index.html
          git commit -m 'Give graded Stock the same market pricing workflow as raw'
          git push origin main
