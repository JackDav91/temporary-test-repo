name: Document Profit Engine architecture

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/document-profit-engine.yml'

permissions:
  contents: write

jobs:
  document:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Append foundation architecture once
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('GENGRAIL_MASTER_PLAN.md')
          s=p.read_text()
          marker='## 16. Profit Engine & Grail Plan Foundation'
          if marker not in s:
            s += '''\n\n## 16. Profit Engine & Grail Plan Foundation\n\n**Status: IN DEVELOPMENT — schema 4 test foundation.** The factual Sales ledger remains the source of completed transaction data. A separate Profit Engine derives realised transaction economics, bootstrap/trading provenance, Profit Split allocations, protected pots, rolling performance signals and Grail Plan state without replacing the existing accounting-profit or Corporation Tax calculations.\n\n**Realised trading profit:** Sale revenue plus buyer-paid postage, less acquisition cost, marketplace/payment fees, postage, packaging and other directly attributable sale costs. Acquisition capital returns to business cash; only positive realised trading profit is eligible for Profit Split. Break-even and loss sales remain performance outcomes but create no allocation credits.\n\n**Profit Split ledger:** Allocations are idempotent and sale-linked. The engine records nominal percentages/amounts, actual amounts, protection redirects and reasons. Sale edits, deletion, refunds/cancellations and resynchronisation reverse previous ledger entries before replacement calculations. Live eBay sales with unconfirmed direct costs are `PENDING_COSTS` and cannot create realised-profit allocations.\n\n**Capital provenance:** Purchased-for-resale inventory produces trading-profit metrics. Owner-contributed inventory produces bootstrap proceeds and never inflates trading-profit averages, stage progression or Owner Readiness. Owner cash contributions remain historically visible as owner funding. Management cost basis on contributed inventory does not create a fictitious business cash outflow.\n\n**Dynamic stages:** Stage selection uses rolling 30-day average daily realised trading profit with configurable 7/30/90/180-day metrics and configurable hysteresis. Defaults require 14 days above an upgrade threshold or 14 days materially below a prior threshold before downgrade. Stage allocations and thresholds live in one configuration structure.\n\n**Protected pots:** Tax Reserve, Business Reserve, Growth Fund and Owner Pot are separate from deployable trading liquidity. Owner/Growth allocations may be transparently redirected when configured tax, reserve or protected-liquidity targets are underfunded; each redirect records its amount and reason.\n\n**Grail Plan state:** `window.getGrailPlanState()` exposes mode (SEED / BUILD / SCALE), deployable/protected liquidity, committed inventory capital, dynamic target range, minimum quality rules, liquidity constraints, stage, rolling averages, self-funding metrics and Owner Readiness inputs. `window.getProfitFinanceSnapshot()` exposes the same financial foundation for a future Finance → Profit Split screen. The full Grail Plan interface is deliberately not part of this foundation patch.\n\n**Opportunity quality:** Grail Plan targets are search objectives, never guarantees. Minimum ROI, minimum margin, confidence, expected sell-through, liquidity protection and concentration safeguards remain superior constraints. Capital velocity is modular and combines projected net profit, ROI, expected days to sale, confidence and capital required.\n\n**Migration/data portability:** Schema-3 backups remain accepted. Historical/ambiguous sales are not blindly assigned Profit Split allocations. New backups carry Profit Engine allocations, ledger, configuration and stage history because the complete database is exported. Data portability remains mandatory.\n\n**Promotion rule:** This foundation stays in `temporary-test-repo` until Profit Engine tests, manual migration/persistence tests and the existing raw/graded recognition, pricing, Stock, Sales, Orders, eBay, Finance, Expenses, Owner, Tax and PWA regression checklist pass.\n'''
            p.write_text(s)
          PY
      - name: Commit documentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add GENGRAIL_MASTER_PLAN.md
          git diff --cached --quiet || git commit -m 'Document Profit Engine and Grail Plan foundation'
          git push origin main
