name: Run Grail identity v1.8
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-grail-identity-v18.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 5
      - name: Apply patch
        run: python .github/scripts/harden_grail_identity_v18.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add grail-hub.js sw.js
          git diff --cached --quiet || git commit -m 'Add Grail Hub language and era identity guards'
          git push origin HEAD:main
