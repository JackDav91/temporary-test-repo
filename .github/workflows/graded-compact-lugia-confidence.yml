name: Compact graded Stock and normalize slab pricing identity

on:
  push:
    branches:
      - agent/slab-recognition-v1
    paths:
      - scripts/patch-graded-compact.py
      - .github/workflows/graded-compact-lugia-confidence.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          ref: agent/slab-recognition-v1
          path: patch-source
      - name: Apply graded patch
        run: python3 patch-source/scripts/patch-graded-compact.py
      - name: Syntax gate
        run: node --check graded-integration.js
      - name: Verify safety markers
        run: |
          grep -q "const ENDPOINT='https://gengrail-card-ai.gengrailtcg.workers.dev'" graded-integration.js
          grep -q "const marketCardNumber=r.normalisedCardNumber||r.cardNumber" graded-integration.js
          grep -q "function confidencePct(r)" graded-integration.js
          grep -q "function stockHtml(r)" graded-integration.js
          grep -q "async function syncPricing(r)" graded-integration.js
          grep -q "recogniseSlabAttempt" graded-integration.js
      - name: Commit to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add graded-integration.js index.html
          git commit -m 'Compact graded Stock result and normalize slab market matching'
          git push origin main
