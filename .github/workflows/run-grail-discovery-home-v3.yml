name: Run Grail discovery and Home restore v3
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-grail-discovery-home-v3.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 10
      - name: Apply guarded patch
        run: python3 .github/scripts/apply_grail_discovery_home_v3.py
      - name: Commit app files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add grail-hub.js home-compact.css index.html sw.js
          git commit -m 'Restore Home UI and loosen Grail discovery thresholds'
          git push origin HEAD:main
# rerun after patch persistence fix
