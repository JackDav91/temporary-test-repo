name: Run Stock UI cleanup v1.9
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-stock-ui-v19.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply guarded Stock UI v1.9 patch
        run: python .github/scripts/apply_stock_ui_v19.py
      - name: Commit Stock UI files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html graded-integration.js sw.js
          git commit -m 'Clean up Stock and recognition UI'
          git push origin HEAD:main
