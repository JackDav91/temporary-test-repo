name: Graded Stock V3 parity and ACE fallback

on:
  push:
    branches:
      - agent/slab-recognition-v1
    paths:
      - .github/workflows/graded-stock-v3-ace-fallback.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch graded UI and ACE fallback only
        run: |
          cp graded-integration.js /tmp/graded-before.js
          cp index.html /tmp/index-before.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('graded-integration.js')
          s=p.read_text()

          marker='.graded-stock-market-actions{margin-top:14px}.graded-stock-market-actions .graded-use-price{width:100%;background:#e0ad16!important;color:#080808!important;border:1px solid #f2c84b!important;border-radius:10px!important;padding:14px!important;font-weight:950!important}'
          add=marker+'''\n.graded-stock-v3{border:2px solid #34764a;border-left:6px solid #48b86c;border-radius:16px;background:linear-gradient(180deg,#06150b,#08110b);padding:18px;margin:0;color:#f4f1ea}.graded-stock-kicker{color:#70e09a;font-size:11px;font-weight:950;letter-spacing:.16em}.graded-stock-identity{border:1px solid #244d31;border-radius:14px;padding:16px;margin-top:12px;background:#07130b}.graded-stock-name{font-size:25px;font-weight:900}.graded-stock-sub{color:#b8beb9;font-size:15px;line-height:1.45;margin-top:4px}.graded-stock-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.graded-stock-meta div{border:1px solid #295138;border-radius:11px;padding:10px;background:#07110a}.graded-stock-meta small{color:#8fa596;font-size:10px;font-weight:900}.graded-stock-meta b{display:block;margin-top:3px;font-size:15px}.graded-stock-verified{display:block;margin-top:12px;border:1px solid #46a960;border-radius:999px;padding:8px 12px;color:#d8dfda;font-size:15px;font-weight:900}.graded-stock-market-v3{margin-top:14px;border:1px solid #34764a;border-radius:14px;padding:15px;background:#07130b}.graded-stock-market-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.graded-stock-market-title{color:#70e09a;font-size:11px;font-weight:950;letter-spacing:.14em}.graded-stock-badge{border:1px solid #46a960;border-radius:999px;padding:6px 9px;color:#9fe9b5;font-size:10px;font-weight:900;white-space:nowrap}.graded-stock-price{color:#70e09a;font-size:36px;font-weight:950;line-height:1;margin-top:10px}.graded-stock-suggested{color:#70e09a;font-size:26px;font-weight:950;margin-top:2px}.graded-stock-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.graded-stock-stat{border:1px solid #2b4e35;border-radius:10px;padding:10px;background:#07110a}.graded-stock-stat small{color:#8ea294;font-size:9px;font-weight:900}.graded-stock-stat b{display:block;color:#89e9a8;font-size:17px;margin-top:3px}.graded-stock-review{color:#ffd36f;font-weight:900;margin-top:12px}.graded-stock-assumed{margin-top:10px;border:1px solid #8a6c25;border-radius:10px;padding:10px;background:#171107;color:#ffd36f;font-size:12px;font-weight:850}.graded-stock-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.graded-stock-actions button{margin:0!important;min-height:62px}.graded-stock-actions .discard{background:#252525!important;color:#fff!important;border:1px solid #444!important}.graded-stock-actions .use{background:#e0ad16!important;color:#080808!important;border:1px solid #f2c84b!important}.graded-stock-workspace .stock-intake-reset{display:none!important}@media(max-width:520px){.graded-stock-meta,.graded-stock-stats{grid-template-columns:1fr 1fr}.graded-stock-actions{grid-template-columns:1fr 1fr}}'''
          if s.count(marker)!=1: raise SystemExit('Stock style marker missing/non-unique')
          s=s.replace(marker,add,1)

          stock_marker='function stockUI(r){'
          if s.count(stock_marker)!=1: raise SystemExit('stockUI marker missing/non-unique')
          renderer=r'''function stockHtml(r){const m=r.marketPricing||{},assumed=m.graderAssumed===true;const identity=[r.cardNumber,r.setName,r.language].filter(Boolean).map(esc).join(' · ');const meta=`<div class="graded-stock-meta"><div><small>GRADER</small><b>${esc(assumed?'ACE · ASSUMED':r.grader)}</b></div><div><small>GRADE</small><b>${esc(r.grade)} ${esc(r.gradeText||'')}</b></div><div><small>CERT</small><b>${esc(r.certNumber||'—')}</b></div></div>`;let market;if(m.available){market=`<div class="graded-stock-market-v3"><div class="graded-stock-market-top"><div class="graded-stock-market-title">MARKET PRICING · V3</div><div class="graded-stock-badge">${assumed?'ACE ASSUMED · CONFIRM':'VALIDATED EXACT SLAB'}</div></div><div class="graded-stock-price">£${Number(m.suggestedGbp||0).toFixed(2)}</div><div class="graded-stock-suggested">Suggested</div><div class="graded-stock-stats"><div class="graded-stock-stat"><small>MARKET LOW</small><b>£${Number(m.lowGbp||0).toFixed(2)}</b></div><div class="graded-stock-stat"><small>MEDIAN</small><b>£${Number(m.medianGbp||m.suggestedGbp||0).toFixed(2)}</b></div><div class="graded-stock-stat"><small>EXACT MATCHES</small><b>${esc(m.exactMatchCount||0)}</b></div></div>${assumed?`<div class="graded-stock-assumed">Grader was not machine-resolved. Gengrail priced this provisionally as ACE using exact card + ACE + grade current listings. Confirm the grader before saving.</div>`:''}</div>`}else{market=`<div class="graded-stock-market-v3"><div class="graded-stock-market-title">MARKET PRICING · V3</div><div class="graded-stock-review">MARKET REVIEW REQUIRED</div><small>${esc(m.note||'Fewer than 3 exact current listing matches. No raw-card fallback has been used.')}</small></div>`}return `<div class="graded-stock-v3"><div class="graded-stock-kicker">VERIFIED CANDIDATE · V3</div><div class="graded-stock-identity"><div class="graded-stock-name">${esc(r.cardName)}</div><div class="graded-stock-sub">${identity}</div><span class="graded-stock-verified">${Math.round((Number(r.confidence)||.99)*100)}% VERIFIED</span>${meta}</div>${market}${picker(r)}<div class="graded-stock-actions"><button class="btn discard" data-gdiscard type="button">DISCARD MATCH</button>${m.available?`<button class="btn use" data-guseprice type="button">USE SUGGESTED PRICE</button>`:''}</div></div>`}\n'''
          s=s.replace(stock_marker,renderer+stock_marker,1)

          start=s.index('function stockUI(r){')
          end=s.index('async function syncStock(r){',start)
          new_stockui=r'''function stockUI(r){style();let h=$('gradedStockBridge');if(!h){h=document.createElement('div');h.id='gradedStockBridge';h.className='graded-bridge';const p=$('stockEntryPanel');p?.parentNode?.insertBefore(h,p)}h.hidden=false;h.innerHTML=stockHtml(r);const b=h.querySelector('[data-gconfirm]');if(b)b.onclick=async()=>{const v=h.querySelector('[data-ggrader]')?.value;if(!v)return;userConfirm(r,v);await syncStock(r)};const use=h.querySelector('[data-guseprice]');if(use)use.onclick=()=>{const v=Number(r?.marketPricing?.suggestedGbp||0);if(!(v>0))return;const t=$('plist');if(t){t.value=v.toFixed(2);t.dispatchEvent(new Event('input',{bubbles:true}));t.dispatchEvent(new Event('change',{bubbles:true}));t.scrollIntoView({behavior:'smooth',block:'center'})}};const discard=h.querySelector('[data-gdiscard]');if(discard)discard.onclick=()=>document.querySelector('.stock-intake-reset')?.click()}\n'''
          s=s[:start]+new_stockui+s[end:]

          start=s.index('async function lookupMarket(r){')
          end=s.index('async function attachMarket(r){',start)
          new_lookup=r'''async function lookupMarket(r){try{const unresolved=!r.grader||r.grader==='UNKNOWN';const marketGrader=unresolved?'ACE':r.grader;const res=await fetch(EBAY_BACKEND+'/api/ebay/graded-market',{method:'POST',mode:'cors',credentials:'omit',cache:'no-store',headers:{'content-type':'application/json','accept':'application/json'},body:JSON.stringify({cardName:r.cardName,cardNumber:r.cardNumber,setName:r.setName,language:r.language,grader:marketGrader,grade:r.grade,canonicalId:r.canonicalId})});const d=await res.json().catch(()=>null);if(!res.ok||!d?.ok)return {available:false,status:'MARKET_REVIEW_REQUIRED',graderAssumed:unresolved,assumedGrader:unresolved?'ACE':'',note:d?.message||'Current graded-market feed unavailable. No raw-card fallback has been used.'};const rows=Array.isArray(d.itemSummaries)?d.itemSummaries:Array.isArray(d.items)?d.items:Array.isArray(d.evidence)?d.evidence:[];let market=null;if(window.GengrailGradedMarket&&rows.length)market=window.GengrailGradedMarket.build({cardName:r.cardName,cardNumber:r.cardNumber,setName:r.setName,language:r.language,grader:marketGrader,grade:r.grade},rows);else if(Number(d.suggestedGbp||0)>0&&Number(d.exactMatchCount||0)>=3)market={available:true,status:d.marketStatus||'ACTIVE_GRADED_MARKET',source:d.source||'eBay current listings · EBAY_GB',evidenceType:d.evidenceType||'current_active_asking_prices',exactMatchCount:Number(d.exactMatchCount||0),confidence:d.confidence||'MEDIUM',matchScore:Number(d.matchScore||0),suggestedGbp:Number(d.suggestedGbp||0),medianGbp:Number(d.medianGbp||d.suggestedGbp||0),lowGbp:Number(d.lowGbp||0),highGbp:Number(d.highGbp||0),evidence:rows,note:d.note||''};if(!market||!market.available)return {available:false,status:'MARKET_REVIEW_REQUIRED',exactMatchCount:Number(market?.exactMatchCount||rows.length||0),graderAssumed:unresolved,assumedGrader:unresolved?'ACE':'',note:market?.note||d.note||'Fewer than 3 exact current listing matches. No raw-card fallback has been used.'};if(unresolved){market.graderAssumed=true;market.assumedGrader='ACE';market.confirmationRequired=true;market.status='PROVISIONAL_ACE_MARKET'}return market}catch(e){return {available:false,status:'MARKET_REVIEW_REQUIRED',note:'Current graded-market service unavailable. No raw-card fallback has been used.'}}}\n'''
          s=s[:start]+new_lookup+s[end:]
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text()
          old='<script src="graded-integration.js?v=21.6.1" data-gengrail-graded-main="1"></script>'
          new='<script src="graded-integration.js?v=21.7.0" data-gengrail-graded-main="1"></script>'
          if s.count(old)!=1: raise SystemExit('Loader marker missing/non-unique')
          p.write_text(s.replace(old,new,1))
          PY

      - name: Verify safety boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          before=Path('/tmp/index-before.html').read_text()
          after=Path('index.html').read_text()
          old='<script src="graded-integration.js?v=21.6.1" data-gengrail-graded-main="1"></script>'
          new='<script src="graded-integration.js?v=21.7.0" data-gengrail-graded-main="1"></script>'
          if after != before.replace(old,new,1): raise SystemExit('index changed beyond graded cache bust')
          g=Path('graded-integration.js').read_text()
          for x in ['function stockHtml(r)','PROVISIONAL_ACE_MARKET',"marketGrader=unresolved?'ACE':r.grader",'async function syncPricing(r)','recogniseSlabAttempt','USE SUGGESTED PRICE','DISCARD MATCH']:
            if x not in g: raise SystemExit('Missing expected marker: '+x)
          if "const ENDPOINT='https://gengrail-card-ai.gengrailtcg.workers.dev'" not in g: raise SystemExit('Recognition endpoint changed')
          PY

      - name: Commit to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add graded-integration.js index.html
          git commit -m 'Match graded Stock V3 UI and add provisional ACE market fallback'
          git push origin main

# trigger 2026-08-16
