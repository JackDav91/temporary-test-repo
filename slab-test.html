<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gengrail Slab Recognition Test</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#080808;color:#f3efe7;font-family:system-ui,-apple-system,sans-serif;padding:18px}.wrap{max-width:760px;margin:auto}.card{background:#111;border:1px solid #333;border-radius:16px;padding:16px;margin-top:14px}.gold{color:#f2c84b}.muted{color:#999}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row{padding:10px;background:#090909;border:1px solid #292929;border-radius:9px}.row small{display:block;color:#999;font-weight:800}.row b{display:block;margin-top:3px;font-size:17px}input,button{width:100%;padding:13px;border-radius:10px;border:1px solid #444;background:#0b0b0b;color:#fff;font-size:16px}button{background:#e0ad16;color:#080808;font-weight:900;border-color:#f2c84b;margin-top:10px}.bad{color:#ff8c8c}.good{color:#82dda0}img{width:100%;max-height:520px;object-fit:contain;background:#050505;border-radius:10px;margin-top:10px}pre{white-space:pre-wrap;word-break:break-word;font-size:11px;color:#bbb}@media(max-width:620px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body><div class="wrap">
<h1>Gengrail <span class="gold">Slab Recognition Test</span></h1>
<p class="muted">Isolated test surface. It does not write to Stock, Pricing, Sales or any saved Gengrail data.</p>
<div class="card">
<label>Preview worker endpoint</label>
<input id="endpoint" value="https://gengrail-card-ai-slab-preview.gengrailtcg.workers.dev">
<label style="display:block;margin-top:12px">Choose graded Pokémon slab photo</label>
<input id="photo" type="file" accept="image/*">
<img id="preview" hidden alt="Selected slab preview">
<button id="run">RECOGNISE SLAB</button>
<p id="status" class="muted">Ready.</p>
</div>
<div id="result" class="card" hidden>
<div class="grid">
<div class="row"><small>GRADER</small><b id="grader">—</b></div>
<div class="row"><small>GRADE</small><b id="grade">—</b></div>
<div class="row"><small>CERT NUMBER</small><b id="cert">—</b></div>
<div class="row"><small>CONFIDENCE</small><b id="confidence">—</b></div>
<div class="row"><small>CARD</small><b id="cardName">—</b></div>
<div class="row"><small>CARD NUMBER</small><b id="cardNumber">—</b></div>
<div class="row"><small>SET / PRODUCT</small><b id="setText">—</b></div>
<div class="row"><small>LANGUAGE</small><b id="language">—</b></div>
<div class="row"><small>CANONICAL VERIFY</small><b id="verified">—</b></div>
<div class="row"><small>CANONICAL SET</small><b id="canonicalSet">—</b></div>
</div>
<details style="margin-top:12px"><summary>Raw response</summary><pre id="raw"></pre></details>
</div>
</div>
<script>
const $=id=>document.getElementById(id);let selected=null;
function toDataUrl(file,max=1600,quality=.84){return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{try{let w=img.width,h=img.height;if(Math.max(w,h)>max){const s=max/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s)}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);resolve(c.toDataURL('image/jpeg',quality))}catch(e){reject(e)}finally{URL.revokeObjectURL(url)}};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Could not read image'))};img.src=url})}
$('photo').addEventListener('change',e=>{selected=e.target.files?.[0]||null;if(selected){$('preview').src=URL.createObjectURL(selected);$('preview').hidden=false;$('status').textContent='Photo selected.'}});
$('run').addEventListener('click',async()=>{if(!selected){$('status').textContent='Choose a slab photo first.';return}const endpoint=$('endpoint').value.trim().replace(/\/+$/,'');$('status').textContent='Reading slab label and card…';$('run').disabled=true;$('result').hidden=true;try{const image=await toDataUrl(selected);const res=await fetch(endpoint+'/api/recognise-slab',{method:'POST',mode:'cors',credentials:'omit',cache:'no-store',headers:{'content-type':'application/json','accept':'application/json'},body:JSON.stringify({scope:'pokemon_graded_single',recognitionVersion:1,image})});const d=await res.json().catch(()=>null);if(!res.ok||!d?.ok)throw new Error(d?.message||d?.error||('HTTP '+res.status));if(!d.identified||!d.card)throw new Error(d?.message||'Slab not identified');const c=d.card,canon=c.canonicalCard||{};$('grader').textContent=c.grader||'—';$('grade').textContent=[c.grade,c.gradeText].filter(Boolean).join(' · ')||'—';$('cert').textContent=c.certNumber||'—';$('confidence').textContent=(c.confidence??0)+'%';$('cardName').textContent=canon.cardName||c.cardName||'—';$('cardNumber').textContent=canon.cardNumber||c.cardNumber||'—';$('setText').textContent=c.setText||'—';$('language').textContent=canon.language||c.language||'—';$('verified').textContent=c.verified?'YES':'NO';$('verified').className=c.verified?'good':'bad';$('canonicalSet').textContent=canon.setName||'—';$('raw').textContent=JSON.stringify(d,null,2);$('result').hidden=false;$('status').textContent=c.reviewRequired?'Result returned — review required.':'Recognition complete.'}catch(e){$('status').textContent='Failed: '+(e?.message||e);$('status').className='bad'}finally{$('run').disabled=false}});
</script>
</body></html>
