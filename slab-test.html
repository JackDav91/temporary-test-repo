<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gengrail Slab Recognition Test</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#080808;color:#f3efe7;font-family:system-ui,-apple-system,sans-serif;padding:18px}.wrap{max-width:760px;margin:auto}.card{background:#111;border:1px solid #333;border-radius:16px;padding:16px;margin-top:14px}.gold{color:#f2c84b}.muted{color:#999}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row{padding:10px;background:#090909;border:1px solid #292929;border-radius:9px}.row small{display:block;color:#999;font-weight:800}.row b{display:block;margin-top:3px;font-size:17px}input,button{width:100%;padding:13px;border-radius:10px;border:1px solid #444;background:#0b0b0b;color:#fff;font-size:16px}button{background:#e0ad16;color:#080808;font-weight:900;border-color:#f2c84b;margin-top:10px}.bad{color:#ff8c8c}.good{color:#82dda0}.review{color:#f2c84b}img{width:100%;max-height:520px;object-fit:contain;background:#050505;border-radius:10px;margin-top:10px}pre{white-space:pre-wrap;word-break:break-word;font-size:11px;color:#bbb}@media(max-width:620px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body><div class="wrap">
<h1>Gengrail <span class="gold">Slab Recognition Test</span></h1>
<p class="muted">Isolated test surface. It does not write to Stock, Pricing, Sales or any saved Gengrail data.</p>
<div class="card">
<label>Preview worker endpoint</label>
<input id="endpoint" value="https://gengrail-card-ai-slab-preview.gengrailtcg.workers.dev">
<label style="display:block;margin-top:12px">Choose graded Pokémon slab photo</label>
<input id="photo" type="file" accept="image/*">
<img id="preview" hidden alt="Selected slab preview">
<button id="run">RECOGNISE SLAB</button>
<p id="status" class="muted">Ready.</p>
</div>
<div id="result" class="card" hidden>
<div class="grid">
<div class="row"><small>GRADER</small><b id="grader">—</b></div>
<div class="row"><small>GRADER VERIFY</small><b id="graderVerified">—</b></div>
<div class="row"><small>GRADE</small><b id="grade">—</b></div>
<div class="row"><small>CERT NUMBER</small><b id="cert">—</b></div>
<div class="row"><small>CONFIDENCE</small><b id="confidence">—</b></div>
<div class="row"><small>CARD</small><b id="cardName">—</b></div>
<div class="row"><small>CARD NUMBER</small><b id="cardNumber">—</b></div>
<div class="row"><small>SET / PRODUCT</small><b id="setText">—</b></div>
<div class="row"><small>LANGUAGE</small><b id="language">—</b></div>
<div class="row"><small>CANONICAL VERIFY</small><b id="verified">—</b></div>
<div class="row"><small>CANONICAL SET</small><b id="canonicalSet">—</b></div>
</div>
<details style="margin-top:12px"><summary>Raw response</summary><pre id="raw"></pre></details>
</div>
</div>
<script>
const $=id=>document.getElementById(id);let selected=null;
function loadImage(file){return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>resolve({img,url});img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Could not read image'))};img.src=url})}
async function toDataUrl(file,{max=1600,quality=.84,rotation=0,crop=.0}={}){const {img,url}=await loadImage(file);try{let sx=0,sy=0,sw=img.width,sh=img.height;if(crop>0){sx=Math.round(sw*crop);sy=Math.round(sh*crop);sw=Math.round(sw*(1-crop*2));sh=Math.round(sh*(1-crop*2))}let w=sw,h=sh;if(Math.max(w,h)>max){const s=max/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s)}const swap=Math.abs(rotation)%180===90,c=document.createElement('canvas');c.width=swap?h:w;c.height=swap?w:h;const x=c.getContext('2d');x.translate(c.width/2,c.height/2);x.rotate(rotation*Math.PI/180);x.drawImage(img,sx,sy,sw,sh,-w/2,-h/2,w,h);return c.toDataURL('image/jpeg',quality)}finally{URL.revokeObjectURL(url)}}
function canonicalIsVerified(c){if(typeof c.canonicalVerified==='boolean')return c.canonicalVerified;if(typeof c.cardIdentityVerified==='boolean')return c.cardIdentityVerified;return Boolean(c.verified&&c.canonicalCard)}
function graderState(c){if(c.graderVerified===true)return {text:'YES',className:'good'};if(c.graderVerified===false||String(c.grader||'').toUpperCase()==='UNKNOWN')return {text:'REVIEW',className:'review'};if(/^grader_cert_verified_/i.test(String(c.verificationStatus||'')))return {text:'YES',className:'good'};return {text:'UNCONFIRMED',className:'review'}}
async function recognise(endpoint,image,rotation,profile){const res=await fetch(endpoint+'/api/recognise-slab',{method:'POST',mode:'cors',credentials:'omit',cache:'no-store',headers:{'content-type':'application/json','accept':'application/json'},body:JSON.stringify({scope:'pokemon_graded_single',recognitionVersion:1,image,clientRotation:rotation,clientImageProfile:profile})});const d=await res.json().catch(()=>null);return {res,d,rotation,profile}}
function readableFailure(r){const d=r?.d,msg=String(d?.message||d?.error||'');return !r?.res?.ok||!d?.ok||!d?.identified||!d?.card||/blurry|unreadable|cannot read|too blurry|not identified/i.test(msg)}
function render(d){const c=d.card,canon=c.canonicalCard||{},canonVerified=canonicalIsVerified(c),gstate=graderState(c);$('grader').textContent=c.grader||'—';$('graderVerified').textContent=gstate.text;$('graderVerified').className=gstate.className;$('grade').textContent=[c.grade,c.gradeText].filter(Boolean).join(' · ')||'—';$('cert').textContent=c.certNumber||'—';$('confidence').textContent=(c.confidence??0)+'%';$('cardName').textContent=canon.cardName||c.cardName||'—';$('cardNumber').textContent=canon.printedCardNumber||canon.cardNumber||c.cardNumber||'—';$('setText').textContent=c.setText||'—';$('language').textContent=canon.language||c.language||'—';$('verified').textContent=canonVerified?'YES':'NO';$('verified').className=canonVerified?'good':'bad';$('canonicalSet').textContent=canon.setName||'—';$('raw').textContent=JSON.stringify(d,null,2);$('result').hidden=false;if(canonVerified&&c.reviewRequired)$('status').textContent='Card identity verified — grader review required.';else $('status').textContent=c.reviewRequired?'Result returned — review required.':'Recognition complete.'}
$('photo').addEventListener('change',e=>{selected=e.target.files?.[0]||null;if(selected){$('preview').src=URL.createObjectURL(selected);$('preview').hidden=false;$('status').textContent='Photo selected.';$('status').className='muted'}});
$('run').addEventListener('click',async()=>{if(!selected){$('status').textContent='Choose a slab photo first.';return}const endpoint=$('endpoint').value.trim().replace(/\/+$/,'');$('status').textContent='Reading slab label and card…';$('status').className='muted';$('run').disabled=true;$('result').hidden=true;try{const attempts=[{rotation:0,max:1800,quality:.88,crop:0,profile:'standard'},{rotation:90,max:2800,quality:.94,crop:.06,profile:'hires-crop'},{rotation:270,max:2800,quality:.94,crop:.06,profile:'hires-crop'},{rotation:180,max:2400,quality:.92,crop:.04,profile:'hires-crop'}];let chosen=null,last=null;for(const a of attempts){$('status').textContent=a.rotation===0?'Reading slab label and card…':`Retrying at ${a.rotation}° with high-resolution crop…`;const image=await toDataUrl(selected,a);const r=await recognise(endpoint,image,a.rotation,a.profile);last=r;if(!readableFailure(r)){chosen=r;break}}const r=chosen||last,d=r?.d;if(!r?.res?.ok||!d?.ok)throw new Error(d?.message||d?.error||('HTTP '+(r?.res?.status||0)));if(!d?.identified||!d?.card)throw new Error(d?.message||'Slab not identified');d.clientOrientationUsed=r.rotation;d.clientImageProfileUsed=r.profile;render(d)}catch(e){$('status').textContent='Failed: '+(e?.message||e);$('status').className='bad'}finally{$('run').disabled=false}});
</script>
</body></html>
