<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>Gengrail Graded Test App</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#080808;overflow:hidden}iframe{display:block;border:0;width:100%;height:100%;background:#080808}
#status{position:fixed;left:12px;right:12px;bottom:12px;z-index:10;padding:10px 12px;border:1px solid #4a3b16;border-radius:10px;background:rgba(8,8,8,.96);color:#f2c84b;font:700 12px system-ui,-apple-system,sans-serif;display:none}
</style>
</head>
<body>
<div id="status">Loading isolated graded bridge…</div>
<iframe id="app" src="./index.html?graded-shell=21.4.1" title="Gengrail graded test app"></iframe>
<script>
(()=>{
  const frame=document.getElementById('app'),status=document.getElementById('status');
  function show(msg){status.textContent=msg;status.style.display='block'}
  frame.addEventListener('load',()=>{
    try{
      const doc=frame.contentDocument;
      if(!doc)throw new Error('App document unavailable');
      if(doc.querySelector('script[data-gengrail-graded-bridge]'))return;
      const s=doc.createElement('script');
      s.src='./graded-integration.js?v=21.4.1';
      s.dataset.gengrailGradedBridge='1';
      s.onload=()=>{status.style.display='none'};
      s.onerror=()=>show('Graded bridge failed to load. Raw app remains untouched.');
      doc.head.appendChild(s);
    }catch(e){show('Could not attach graded test bridge. Raw app remains untouched.')}
  });
})();
</script>
</body>
</html>
